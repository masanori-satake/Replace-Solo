name: 'リリースパッケージ公開 (Release Package)'

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: '共通リリース処理実行 (Execute Base Release)'
    uses: masanori-satake/common-workflows/.github/workflows/base-release.yml@v1
    permissions:
      contents: write
    with:
      # リリース ZIP は base-release 側で {リポジトリ名}-v{version}.zip に統一生成する（方式A）。
      # 従来のバージョン無しファイル名（Replace-Solo-Chrome.zip）から Replace-Solo-v{version}.zip に統一。
      package_source_dir: 'projects/app'
    # npm run build (= check_version.py) はリリース前のバージョン整合性検証のみを行う。
    # マニフェストは projects/app/manifest.json のためリネーム不要。
    # アイコンはコミット済みPNGを同梱（PNGクロップ/角丸/グレースケールの固有処理は generate_icons.yml で管理）。

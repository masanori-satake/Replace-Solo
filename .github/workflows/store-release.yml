name: 'ストア提出 (Store Release)'

on:
  workflow_dispatch:
    inputs:
      stores:
        description: '提出先ストア'
        required: true
        type: choice
        options:
          - chrome
          - both
          - edge
        # Edge の初回提出（Partner Center）が済むまでは chrome を既定にし、
        # 誤って Edge へ投げる事故を防ぐ。初回提出後は both へ変更してよい。
        default: 'chrome'

# 提出の直列化は base 側（ストア別ジョブの concurrency）で行うため、
# 呼び出し側に concurrency は置かない（実行中の提出をキャンセルしない）。

jobs:
  store-release:
    name: '共通ストア提出実行 (Execute Base Store Release)'
    uses: masanori-satake/common-workflows/.github/workflows/base-release-chrome.yml@v1
    permissions:
      contents: read
    secrets: inherit
    with:
      stores: ${{ inputs.stores }}
      # Replace-Solo の Chrome Web Store アイテム ID
      chrome_item_id: 'iblfnonogpkajjfjfljngdaclhdinlfb'
      # Replace-Solo の Edge 製品 ID（Partner Center、初回提出 2026-11-22）
      edge_product_id: '01482729-35d3-41ab-bfa1-4158da0211fb'
      # 提出 ZIP は release-package と同じく projects/app から base 側で生成する
      package_source_dir: 'projects/app'
